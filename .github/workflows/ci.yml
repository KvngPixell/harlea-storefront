name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to publish a generated lockfile branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        id: install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund && echo "generated=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Until a lockfile is committed, share the one CI generated on its own branch
      # so it can be reviewed and merged (keeps future installs reproducible).
      - name: Publish generated lockfile
        if: steps.install.outputs.generated == 'true' && github.event_name == 'push'
        env:
          BRANCH: ci/lockfile-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -m "chore: add package-lock.json generated by CI [skip ci]"
          git push origin "$BRANCH"

  database:
    name: Database security tests (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply stub + migrations
        run: |
          psql -v ON_ERROR_STOP=1 -q -c 'create database shop'
          for f in tests/db/supabase-stub.sql supabase/migrations/*.sql; do
            echo "== $f"; psql -v ON_ERROR_STOP=1 -q -d shop -f "$f"
          done
      - name: Run RLS tests
        run: psql -v ON_ERROR_STOP=1 -d shop -f tests/db/rls_test.sql
